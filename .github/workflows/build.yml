name: Build Windows DLL

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up MSVC x64
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ build tools not found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          cmd.exe /d /c "`"$vcvars`" >nul && set" | Where-Object { $_ -match '^([^=]+)=(.*)$' } | ForEach-Object {
            $name, $value = $_ -split '=', 2
            [Environment]::SetEnvironmentVariable($name, $value, 'Process')
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package DLL
        shell: pwsh
        run: |
          $package = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item build/FlexSkyBridge.dll $package/
          Copy-Item README.md $package/
          Copy-Item LICENSE $package/
          Compress-Archive -Path "$package/*" -DestinationPath "FlexSkyBridge-windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FlexSkyBridge-windows-x64
          path: FlexSkyBridge-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: FlexSkyBridge-windows-x64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" FlexSkyBridge-windows-x64.zip --generate-notes --verify-tag
